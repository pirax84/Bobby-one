<style>
#splash{position:fixed;inset:0;z-index:99999;background:linear-gradient(#3F46A0,#1A1B63);display:flex;align-items:center;justify-content:center;transition:opacity .35s;overflow:hidden}
#splash.out{opacity:0;pointer-events:none}
#splash .spw{position:relative;width:min(78vw,460px);height:calc(min(78vw,460px)*.3511);margin-top:-4vh;flex:none}
#splash .spl,#splash .spr,#splash .spp{position:absolute;left:0;top:0;width:100%;height:100%}
#splash .spl img,#splash .spr img{position:absolute;left:0;top:0;width:100%;height:100%}
#splash .spl img{opacity:0;animation:sdrop .5s cubic-bezier(.45,0,.9,.6) var(--d) forwards}
#splash .spr{top:calc(100% + 10px);transform:scaleY(-1);-webkit-mask-image:linear-gradient(to bottom,transparent 15%,rgba(0,0,0,.55) 100%);mask-image:linear-gradient(to bottom,transparent 15%,rgba(0,0,0,.55) 100%)}
#splash .spr img{opacity:0;animation:srefl 1.2s ease-out calc(var(--d) + 480ms) forwards}
#splash .spp{top:calc(100% + 10px);height:0}
#splash .spp i{position:absolute;top:0;width:20px;height:6px;margin:-3px 0 0 -10px;border:1px solid rgba(200,212,255,.55);border-radius:50%;opacity:0;animation:sring 1.1s ease-out var(--d) forwards}
#splash .spp i.r2{animation-duration:1.2s}
@keyframes sdrop{0%{opacity:1;transform:translateY(-55vh)}78%{opacity:1;transform:translateY(0)}88%{opacity:1;transform:translateY(-6px)}100%{opacity:1;transform:translateY(0)}}
@keyframes srefl{0%{opacity:.9;transform:translateX(0) skewX(0)}20%{transform:translateX(3px) skewX(5deg)}40%{transform:translateX(-3px) skewX(-5deg)}60%{transform:translateX(2px) skewX(3deg)}80%{opacity:.35;transform:translateX(-1px) skewX(-1deg)}100%{opacity:.18;transform:none}}
@keyframes sring{0%{opacity:.8;transform:scale(.4)}100%{opacity:0;transform:scale(9,5)}}
@media (prefers-reduced-motion:reduce){#splash .spl img{animation:none;opacity:1}#splash .spr,#splash .spp{display:none}}
</style>
