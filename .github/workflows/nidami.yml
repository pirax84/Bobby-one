name: Nidami (vérification)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["nidami/**", ".github/workflows/nidami.yml"]

jobs:
  verifier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nidami
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Tests des règles (publications éphémères)
        run: npm test
      - name: Vérification des types
        run: npm run typecheck
      - name: Construction du site (Vite)
        run: npm run build
