name: Application Android Cercle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android-cercle/**", ".github/workflows/android-cercle.yml"]

permissions:
  contents: write

concurrency:
  group: android-cercle
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Accepter les licences Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Construire l'APK
        id: build
        continue-on-error: true
        working-directory: android-cercle
        run: gradle assembleRelease --no-daemon --console=plain --stacktrace 2>&1 | tee ../build.log; exit ${PIPESTATUS[0]}

      - name: Garder le journal de construction (pour le diagnostic)
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/ci && { echo "status: ${{ steps.build.outcome }}"; echo "run: ${{ github.run_number }}"; grep -nE "^e: |error:|FAILED|What went wrong|Caused by|Could not|BUILD " build.log | head -80; echo ----; tail -60 build.log; } > /tmp/ci/build-log.txt
          git checkout --orphan ci-logs-cercle
          git rm -rf --quiet . || true
          cp /tmp/ci/build-log.txt build-log.txt
          git add build-log.txt
          git commit -q -m "journal de construction ${{ github.run_number }}"
          git push -f origin ci-logs-cercle

      - name: Publier l'APK
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-cercle/app/build/outputs/apk/release/app-release.apk cercle.apk
          gh release delete cercle-android-latest --yes --cleanup-tag || true
          gh release create cercle-android-latest cercle.apk --title "Mon cercle pour Android" --notes "Version ${{ github.run_number }} — à installer directement sur le téléphone." --latest=false
