name: NOTIIF (copie de secours sur GitHub Pages)
# Copie du site, utile si Vercel est limité. Active-la une fois : Settings > Pages > Source : GitHub Actions.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["nidami/**", ".github/workflows/nidami-pages.yml"]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund && npm run build
        working-directory: nidami
      - uses: actions/upload-pages-artifact@v3
        with: { path: nidami/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
